included:
  - Sources
  - Tests
  - Examples

excluded:
  - .build
  - Examples/ConsumerCheck/build

disabled_rules:
  - todo # plan-driven repo; open work is tracked in PLAN.md ticks

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

line_length:
  warning: 140
  error: 200

identifier_name:
  min_length: 2
  excluded: [id, ok, on, to, at]

# Multiline collection literals keep trailing commas (diff hygiene).
trailing_comma:
  mandatory_comma: true

type_body_length:
  warning: 350

file_length:
  warning: 600
