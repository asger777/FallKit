# ConsumerCheck: proves an XcodeGen app can use FallKit by URL + tag next to an
# exact Firebase pin. Generated by check.sh (FALLKIT_VERSION, FIREBASE_VERSION);
# never committed as project.yml.
name: ConsumerCheck
options:
  bundleIdPrefix: dev.fallkit
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FallKit:
    url: https://github.com/asger777/FallKit
    exactVersion: "__FALLKIT_VERSION__"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "__FIREBASE_VERSION__"
targets:
  ConsumerCheck:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    dependencies:
      - package: FallKit
        product: LiveOpsStore
      - package: FallKit
        product: LiveOpsFirebase
      - package: Firebase
        product: FirebaseAnalytics
  ConsumerCheckWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    settings:
      base:
        INFOPLIST_KEY_WKApplication: "YES"
        INFOPLIST_KEY_WKWatchOnly: "YES"
    dependencies:
      - package: FallKit
        product: LiveOpsCore
